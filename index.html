<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akay Mighty Concept — Website Developer &amp; Graphics Designer</title>
  <meta name="description" content="Redirecting to home page…" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='Montserrat,Arial,sans-serif' font-size='52' font-weight='900' fill='%23ff1a1a' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <!-- ============ INSTANT REDIRECT ============ -->
  <!-- Multiple fallbacks so we always land on /home.html
       1. <meta http-equiv="refresh"> fires immediately
       2. JS replace fires on DOMContentLoaded
       3. Visible link below for anyone with JS/meta disabled
  -->
  <meta http-equiv="refresh" content="0; url=/home.html" />
  <link rel="canonical" href="/home.html" />

  <style>
    /* Minimal dark redirect page — same dark theme as the rest of the site */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --red: #2a2a85; --red-bright: #4a4ad5;
      --bg: #0a0a0a; --bg2: #111111;
      --text: #f0f0f0; --text-muted: #888; --text-dim: #555;
      --border: rgba(255,255,255,0.07); --border-red: rgba(42,42,133,0.3);
      --font-body: 'Poppins', sans-serif; --font-heading: 'Montserrat', sans-serif;
      --gradient-red: linear-gradient(135deg, #2a2a85 0%, #4a4ad5 50%, #16166e 100%);
    }
    html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
    body {
      font-family: var(--font-body); background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .redirect-card {
      max-width: 420px; padding: 48px 32px;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .redirect-logo {
      width: 70px; height: 70px; margin: 0 auto 20px;
      border-radius: 14px; overflow: hidden;
      background: var(--bg); border: 1px solid var(--border-red);
      box-shadow: 0 0 60px rgba(42,42,133,0.4);
    }
    .redirect-logo img { width: 100%; height: 100%; object-fit: cover; }
    .redirect-brand {
      font-family: var(--font-heading); font-weight: 900; font-size: 14px;
      letter-spacing: 2px; color: var(--text); margin-bottom: 6px;
    }
    .redirect-brand span { color: var(--red); }
    .redirect-title {
      font-family: var(--font-heading); font-size: 22px; font-weight: 800;
      margin: 18px 0 8px; line-height: 1.2;
    }
    .redirect-sub {
      font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 24px;
    }
    .redirect-spinner {
      width: 30px; height: 30px; margin: 0 auto 16px;
      border: 3px solid var(--border); border-top-color: var(--red-bright);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirect-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 13px;
      background: var(--gradient-red); color: white; text-decoration: none;
      box-shadow: 0 4px 18px rgba(74,74,213,0.35); transition: transform 0.2s;
    }
    .redirect-link:hover { transform: translateY(-2px); }
    .redirect-link svg { width: 14px; height: 14px; }

    /* Hidden admin trigger — triple-click anywhere on the logo image */
    .hidden-admin-logo {
      position: absolute; top: 12px; left: 12px;
      width: 38px; height: 38px; opacity: 0.05;
      cursor: pointer; border-radius: 8px; overflow: hidden;
    }
    .hidden-admin-logo img { width: 100%; height: 100%; object-fit: cover; }
  </style>

  <!-- Google Fonts so the redirect card matches the brand -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <!--
    Triple-click inline fallback — fires immediately so admin access works
    even before the redirect lands on /home.html (where admin.js takes over).
    Clicking the small logo in the top-left 3 times within 800ms opens /admin.html.
  -->
  <script>
  (function() {
    // Immediate redirect — runs before <body> even parses if possible
    try {
      var currentPath = window.location.pathname;
      var isRoot = currentPath === '/' || currentPath === '/index.html' ||
                   currentPath === '' || currentPath.endsWith('/akay-phase1/') ||
                   currentPath.endsWith('/akay-phase1/index.html');
      if (isRoot && !window.location.search.includes('noredir')) {
        // We do the actual replace down below after attaching the click handler,
        // so users with JS get a ~50ms window to triple-click if they want admin.
      }
    } catch (e) {}

    var clicks = 0, timer = null, redirected = false;

    function goHome() {
      if (redirected) return;
      redirected = true;
      window.location.replace('/home.html');
    }

    function attachAdminClick() {
      var logo = document.getElementById('adminTrigger');
      if (!logo) { setTimeout(attachAdminClick, 30); return; }
      logo.addEventListener('click', function(e) {
        clicks++;
        clearTimeout(timer);
        timer = setTimeout(function() { clicks = 0; }, 800);
        if (clicks >= 3) {
          e.preventDefault();
          clicks = 0;
          redirected = true; // cancel the redirect
          window.location.href = './admin.html';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      attachAdminClick();
      // Give the user ~120ms after DOMContentLoaded to triple-click,
      // otherwise we redirect to /home.html. admin.js handles triple-click
      // from there.
      setTimeout(goHome, 120);
    });

    // Hard fallback: if DOMContentLoaded hasn't fired in 1s, redirect anyway
    setTimeout(goHome, 1000);
  })();
  </script>
</head>
<body>
  <!-- Tiny corner logo = triple-click target for admin access -->
  <a href="#" id="adminTrigger" class="hidden-admin-logo" aria-label="Admin access" title="Admin access">
    <img src="./akay-logo.jpg" alt="Akay Mighty Concept" />
  </a>

  <main class="redirect-card">
    <div class="redirect-logo">
      <img src="./akay-logo.jpg" alt="Akay Mighty Concept" />
    </div>
    <div class="redirect-brand">AKAY <span>MIGHTY</span> CONCEPT</div>
    <div class="redirect-spinner"></div>
    <h1 class="redirect-title">Taking you home…</h1>
    <p class="redirect-sub">You should be redirected automatically. If nothing happens, click the button below.</p>
    <a href="/home.html" class="redirect-link">
      Go to Home
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </main>

  <!--
    Plain-text fallback for screen readers and crawlers — never visible
    to humans unless CSS is disabled.
  -->
  <p style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">
    This page has moved to <a href="/home.html">/home.html</a>.
  </p>
</body>
</html>

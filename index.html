<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akay Mighty Concept | Graphics Design Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       RESET & BASE
    ============================================= */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --red: #ff1a1a;
      --red-dark: #cc0000;
      --red-glow: rgba(255, 26, 26, 0.15);
      --bg: #0a0a0a;
      --bg2: #111111;
      --bg3: #161616;
      --bg4: #1c1c1c;
      --text: #f0f0f0;
      --text-muted: #888;
      --text-dim: #555;
      --border: rgba(255,255,255,0.07);
      --border-red: rgba(255,26,26,0.3);
      --font-body: 'Poppins', sans-serif;
      --font-heading: 'Montserrat', sans-serif;
      --radius: 12px;
      --radius-lg: 20px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.7;
    }

    img { display: block; width: 100%; object-fit: cover; }
    a { text-decoration: none; color: inherit; }
    ul { list-style: none; }

    /* =============================================
       TYPOGRAPHY
    ============================================= */
    h1, h2, h3, h4 { font-family: var(--font-heading); line-height: 1.2; }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 800;
      color: var(--text);
      margin-bottom: 16px;
    }

    .section-title span { color: var(--red); }

    .section-desc {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 560px;
      line-height: 1.8;
    }

    /* =============================================
       LAYOUT
    ============================================= */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    section { padding: 100px 0; }

    .section-header {
      margin-bottom: 60px;
    }

    /* =============================================
       BUTTONS
    ============================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
      box-shadow: 0 0 30px var(--red-glow);
    }

    .btn-primary:hover {
      background: var(--red-dark);
      box-shadow: 0 0 50px rgba(255,26,26,0.35);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--red);
      border: 1.5px solid var(--red);
    }

    .btn-outline:hover {
      background: var(--red);
      color: #fff;
      box-shadow: 0 0 30px var(--red-glow);
      transform: translateY(-2px);
    }

    /* =============================================
       GLOW BACKGROUNDS
    ============================================= */
    .glow-bg {
      position: relative;
      overflow: hidden;
    }

    .glow-bg::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,26,26,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* =============================================
       NAVBAR
    ============================================= */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 20px 0;
      transition: var(--transition);
    }

    #navbar.scrolled {
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* REPLACE: swap the <img> src with your actual logo path */
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--bg3);
      border: 1px solid var(--border-red);
    }

    .nav-logo-text {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 18px;
      line-height: 1.1;
    }

    .nav-logo-text span { color: var(--red); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color var(--transition);
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--red);
      transition: width var(--transition);
    }

    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after { width: 100%; }

    .nav-cta { margin-left: 8px; }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
      background: none;
      border: none;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: var(--transition);
    }

    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Mobile nav */
    .mobile-nav {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10,10,10,0.98);
      backdrop-filter: blur(20px);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    .mobile-nav.open {
      display: flex;
      opacity: 1;
      pointer-events: all;
    }

    .mobile-nav a {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--text-muted);
      transition: color var(--transition);
    }

    .mobile-nav a:hover { color: var(--red); }

    /* =============================================
       HERO
    ============================================= */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* REPLACE: Change the background-image URL to your hero image path */
    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://cdn.kord.live/serve/p6rY9MStOU36.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.75) 50%, rgba(10,10,10,0.85) 100%);
    }

    .hero-glow {
      position: absolute;
      bottom: -200px;
      left: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,26,26,0.08) 0%, transparent 65%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 720px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,26,26,0.1);
      border: 1px solid var(--border-red);
      color: var(--red);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: 50px;
      margin-bottom: 28px;
    }

    .hero-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    .hero-title {
      font-size: clamp(40px, 7vw, 80px);
      font-weight: 900;
      line-height: 1.05;
      color: var(--text);
      margin-bottom: 24px;
    }

    .hero-title .line-red { color: var(--red); }

    .hero-tagline {
      font-size: clamp(16px, 2vw, 20px);
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 44px;
      max-width: 520px;
    }

    .hero-btns {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 1;
    }

    .scroll-line {
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, var(--red), transparent);
      animation: scrollAnim 2s infinite;
    }

    @keyframes scrollAnim {
      0% { transform: scaleY(0); transform-origin: top; }
      50% { transform: scaleY(1); transform-origin: top; }
      50.1% { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; }
    }

    /* =============================================
       ABOUT
    ============================================= */
    #about {
      background: var(--bg);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .about-img-wrap {
      position: relative;
    }

    /* REPLACE: about image */
    .about-img {
      width: 100%;
      height: 520px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      background: var(--bg3);
      border: 1px solid var(--border);
    }

    .about-img-placeholder {
      width: 100%;
      height: 520px;
      border-radius: var(--radius-lg);
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 14px;
      gap: 12px;
    }

    .about-img-placeholder svg { opacity: 0.3; }

    .about-badge {
      position: absolute;
      bottom: -20px;
      right: -20px;
      background: var(--red);
      color: #fff;
      font-family: var(--font-heading);
      font-weight: 800;
      border-radius: var(--radius);
      padding: 20px 24px;
      text-align: center;
      box-shadow: 0 0 40px rgba(255,26,26,0.3);
    }

    .about-badge .num {
      font-size: 36px;
      line-height: 1;
      display: block;
    }

    .about-badge .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .about-content .section-desc {
      max-width: 100%;
      margin-bottom: 24px;
    }

    .about-skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 32px;
    }

    .skill-tag {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 50px;
      transition: var(--transition);
    }

    .skill-tag:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* =============================================
       SERVICES (shared)
    ============================================= */
    #design-services { background: var(--bg2); }
    #print-services  { background: var(--bg);  }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .service-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition);
      cursor: default;
    }

    .service-card:hover {
      border-color: var(--border-red);
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 30px var(--red-glow);
    }

    /* REPLACE: service card image */
    .service-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: var(--bg4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .service-img-placeholder {
      width: 100%;
      height: 180px;
      background: var(--bg4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 8px;
      font-size: 12px;
    }

    .service-card-body {
      padding: 20px 22px 24px;
    }

    .service-icon {
      width: 40px;
      height: 40px;
      background: rgba(255,26,26,0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .service-icon svg { width: 20px; height: 20px; color: var(--red); }

    .service-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .service-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* =============================================
       PORTFOLIO
    ============================================= */
    #portfolio { background: var(--bg2); }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto;
      gap: 16px;
    }

    .portfolio-grid .item:nth-child(1) { grid-column: span 2; }
    .portfolio-grid .item:nth-child(5) { grid-column: span 2; }

    .portfolio-item {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      background: var(--bg4);
    }

    /* REPLACE: portfolio images */
    .portfolio-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background: var(--bg4);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portfolio-img-placeholder {
      width: 100%;
      height: 260px;
      background: var(--bg4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 8px;
      font-size: 12px;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .portfolio-item:hover .portfolio-img-placeholder,
    .portfolio-item:hover .portfolio-img { transform: scale(1.06); }

    .portfolio-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.9) 0%, rgba(10,10,10,0.3) 50%, transparent 100%);
      opacity: 0;
      transition: opacity var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px;
    }

    .portfolio-item:hover .portfolio-overlay { opacity: 1; }

    .portfolio-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 6px;
    }

    .portfolio-name {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    /* =============================================
       ORDER FORM
    ============================================= */
    #order { background: var(--bg3); position: relative; overflow: hidden; }

    #order::before {
      content: '';
      position: absolute;
      top: -300px;
      right: -200px;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,26,26,0.05) 0%, transparent 65%);
      pointer-events: none;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 80px;
      align-items: start;
    }

    .order-info .section-desc { margin-bottom: 40px; }

    .order-feature {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 24px;
    }

    .order-feature-icon {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 8px;
      background: rgba(255,26,26,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .order-feature-icon svg { width: 16px; height: 16px; color: var(--red); }

    .order-feature-text h4 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .order-feature-text p { font-size: 13px; color: var(--text-muted); }

    .order-form-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(255,26,26,0.1);
    }

    .form-group select option { background: var(--bg3); }

    .form-group textarea {
      height: 120px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-submit {
      width: 100%;
      padding: 16px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      box-shadow: 0 0 30px var(--red-glow);
    }

    .form-submit:hover {
      background: var(--red-dark);
      box-shadow: 0 0 50px rgba(255,26,26,0.35);
      transform: translateY(-2px);
    }

    /* =============================================
       CONTACT
    ============================================= */
    #contact { background: var(--bg); }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60p

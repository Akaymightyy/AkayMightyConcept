<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AkayMightyConcept</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- Paystack -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0b0b0b;
  color:#fff;
}

/* HERO */
.hero-img img{
  width:100%;
  height:380px;
  object-fit:cover;
}

.hero-text{
  text-align:center;
  padding:40px 20px;
}
.hero-text h1{
  font-size:2.2rem;
}
.hero-text h2{
  color:#800000;
}

/* PRODUCTS */
.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}
.card{
  background:#111;
  padding:15px;
  border-radius:10px;
  width:250px;
  text-align:center;
}
.card img{
  width:100%;
  height:150px;
  object-fit:cover;
}
button{
  padding:10px;
  background:#800000;
  border:none;
  color:#fff;
  cursor:pointer;
}

/* FORM */
form{
  max-width:400px;
  margin:30px auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
input,select{
  padding:10px;
  border:none;
  border-radius:5px;
}

/* ADMIN */
#adminPanel{
  display:none;
  padding:20px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  border:1px solid #333;
  padding:10px;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero-img">
<img src="https://cdn.kord.live/serve/p6rY9MStOU36.jpg">
</div>

<div class="hero-text">
<h1>Welcome to</h1>
<h2>AkayMightyConcept</h2>
<p>Premium Graphics Design & Printing</p>
</div>

<!-- PRODUCTS -->
<h2 style="text-align:center;">Our Services</h2>

<div class="products">

<div class="card">
<img src="https://cdn.kord.live/serve/p6rY9MStOU36.jpg">
<h3>Logo Design</h3>
<p>₦5,000</p>
<button onclick="selectService('Logo Design',5000)">Order</button>
</div>

<div class="card">
<img src="https://cdn.kord.live/serve/p6rY9MStOU36.jpg">
<h3>Flyer Design</h3>
<p>₦3,000</p>
<button onclick="selectService('Flyer Design',3000)">Order</button>
</div>

<div class="card">
<img src="https://cdn.kord.live/serve/p6rY9MStOU36.jpg">
<h3>Printing</h3>
<p>₦10,000</p>
<button onclick="selectService('Printing',10000)">Order</button>
</div>

</div>

<!-- ORDER FORM -->
<h2 style="text-align:center;">Place Order</h2>

<form id="orderForm">
<input type="text" id="name" placeholder="Name" required>
<input type="email" id="email" placeholder="Email" required>

<select id="service">
<option>Logo Design</option>
<option>Flyer Design</option>
<option>Printing</option>
</select>

<input type="number" id="price" placeholder="Price" required>

<button type="submit">Pay & Submit</button>
</form>

<!-- ADMIN -->
<h2 style="text-align:center;">Admin</h2>
<div style="text-align:center;">
<input type="password" id="adminPass" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="adminPanel">
<h2>Orders</h2>
<input type="text" id="searchOrder" placeholder="Search...">

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Service</th>
<th>Price</th>
<th>Status</th>
</tr>
</thead>
<tbody id="ordersTable"></tbody>
</table>
</div>

<!-- FIREBASE -->
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBpyyasdx-xwp9vyf-XpcFgXmzAWjGJgvA",
  authDomain: "akaymightyconcept.firebaseapp.com",
  projectId: "akaymightyconcept",
  storageBucket: "akaymightyconcept.firebasestorage.app",
  messagingSenderId: "536093439129",
  appId: "1:536093439129:web:354acfeb1b476318ba3408",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<!-- SCRIPT -->
<script>

function selectService(service, price){
  document.getElementById("service").value = service;
  document.getElementById("price").value = price;
  window.scrollTo({top:document.getElementById("orderForm").offsetTop,behavior:"smooth"});
}

document.getElementById("orderForm").addEventListener("submit", async e=>{
e.preventDefault();

const order={
  name:name.value,
  email:email.value,
  service:service.value,
  price:price.value,
  status:"Pending",
  createdAt:new Date()
};

await db.collection("orders").add(order);

PaystackPop.setup({
key:"YOUR_PAYSTACK_PUBLIC_KEY",
email:order.email,
amount:order.price*100,
callback:function(){alert("Payment Successful");}
}).openIframe();
});

function login(){
if(adminPass.value==="AkayAdmin123"){
  adminPanel.style.display="block";
  loadOrders();
}else alert("Wrong password");
}

function loadOrders(){
db.collection("orders").orderBy("createdAt","desc")
.onSnapshot(snapshot=>{
let html="";
snapshot.forEach(doc=>{
let o=doc.data();
html+=`
<tr>
<td>${o.name}</td>
<td>${o.email}</td>
<td>${o.service}</td>
<td>₦${o.price}</td>
<td>
<select onchange="updateStatus('${doc.id}',this.value)">
<option ${o.status=="Pending"?"selected":""}>Pending</option>
<option ${o.status=="In Progress"?"selected":""}>In Progress</option>
<option ${o.status=="Completed"?"selected":""}>Completed</option>
</select>
</td>
</tr>`;
});
ordersTable.innerHTML=html;
});
}

function updateStatus(id,status){
db.collection("orders").doc(id).update({status});
}

document.getElementById("searchOrder").addEventListener("input", e=>{
let val=e.target.value.toLowerCase();
document.querySelectorAll("#ordersTable tr").forEach(row=>{
row.style.display=row.innerText.toLowerCase().includes(val)?"":"none";
});
});

</script>

</body>
</html>
